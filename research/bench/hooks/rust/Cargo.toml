[package]
name = "folkways-bench-hook"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "folkways-bench-hook"
path = "src/main.rs"

[dependencies]
regex = "=1.13.1"
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
yaml-rust2 = "=0.13.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
