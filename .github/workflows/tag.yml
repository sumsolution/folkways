name: tag

# Tags v<version> on the push to main that changes the version in packages/folkways/package.json (the merged
# `changeset version` PR). The tag push starts release.yml, whose publish job still waits for approval.
# The `release tags` ruleset lets only its bypass actors create v* tags, and a tag pushed with the workflow token
# wouldn't start release.yml, so this uses the tap App: installed on this repo (contents: write), a bypass actor on
# that ruleset, its credentials in the `tag` environment (main only, no reviewers).
# Prerelease tags (v<version>-rc.<n>) stay manual.
on:
  push:
    branches: [main]
    paths: ['packages/folkways/package.json']

permissions:
  contents: read

# No concurrency group: it would cancel a pending run, and with it a tag. Two runs racing on one tag: one gets a 422.

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the previous version and the existing tags
          persist-credentials: false
      - name: Did this push change the version?
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version() { git show "$1:packages/folkways/package.json" | node -p 'JSON.parse(require("fs").readFileSync(0)).version'; }
          v=$(version HEAD)
          before=$(version "$BEFORE") # fails the step if BEFORE can't be read, rather than tagging
          if [ "$before" = "$v" ]; then
            echo "version unchanged ($v)"
          elif [ "${v#*-}" != "$v" ]; then
            echo "$v is a prerelease; tag it by hand"
          elif git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already tagged"
          else
            echo "tag=v$v" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: steps.version.outputs.tag
        id: app
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          repositories: folkways
          permission-contents: write
      - name: Create the tag
        if: steps.version.outputs.tag
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "tagged $GITHUB_SHA as $TAG"
