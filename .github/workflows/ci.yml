name: ci

on:
  pull_request:
  push:
    branches: [main]
    # Pull requests already skip every job for a docs-only change (no filter matches).
    paths-ignore:
      - 'docs/**'
      - '*.md'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs run only for the packages a change touches (ADR 0003). Pushes to main run everything.
# The `ci` job at the end is the only required check: skipped jobs count as passing.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{ github.event_name == 'push' || steps.filter.outputs.cli == 'true' || steps.filter.outputs.content == 'true' || steps.filter.outputs.shared == 'true' }}
      content: ${{ github.event_name == 'push' || steps.filter.outputs.content == 'true' || steps.filter.outputs.shared == 'true' }}
      hooks: ${{ github.event_name == 'push' || steps.filter.outputs.hooks == 'true' || steps.filter.outputs.shared == 'true' }}
      evals: ${{ github.event_name == 'push' || steps.filter.outputs.evals == 'true' || steps.filter.outputs.shared == 'true' }}
      claude-plugin: ${{ github.event_name == 'push' || steps.filter.outputs.claude-plugin == 'true' || steps.filter.outputs.shared == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pull requests only: pushes run everything, and on a push the filter fetches the
      # previous commit, which fails without the credentials checkout doesn't persist.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            cli:
              - 'packages/cli/**'
            content:
              - 'packages/content/**'
            hooks:
              - 'packages/folkways/**'
              - 'packages/content/**' # the binary embeds it
            evals:
              - 'packages/evals/**'
              - 'packages/cli/**'     # the runner builds team repos with the CLI's init
              - 'packages/content/**' # and with the framework content
            claude-plugin:
              - 'packages/claude-plugin/**'
              - 'packages/content/**'     # the plugin's skills, instructions and hooks come from here
              - 'packages/folkways/**'    # and its binaries
              - '.claude-plugin/**'
            shared:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.pnpmfile.mjs'
              - 'tsconfig.base.json'
              - 'tsconfig.json'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/**'
              - 'scripts/**'

  content:
    name: content
    needs: changes
    if: needs.changes.outputs.content == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folkways/content run check
      - run: pnpm --filter @folkways/content test

  cli-check:
    name: cli check
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folkways/cli run check
      - name: Typecheck scripts/
        run: pnpm exec tsc -p tsconfig.json
      - run: pnpm --filter @folkways/cli run build

  cli-test:
    name: cli test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folkways/cli test

  hooks:
    name: hooks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.hooks == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folkways/hooks run check
      - name: Build the binaries
        working-directory: packages/folkways
        run: go build -o bin/folkways-hook ./cmd/folkways-hook && go build -o bin/folkways ./cmd/folkways
      - name: Go vet and tests (builds ./cmd/folkways for the contract suite)
        working-directory: packages/folkways
        run: go vet ./... && go test ./...
      - name: Contract suite against folkways-hook
        working-directory: packages/folkways
        env:
          FOLKWAYS_HOOK_CMD: ${{ github.workspace }}/packages/folkways/bin/folkways-hook
        run: go test -count=1 ./contract
      - name: Contract suite through folkways hook, with the hook latency budget
        working-directory: packages/folkways
        env:
          FOLKWAYS_HOOK_CMD: ${{ github.workspace }}/packages/folkways/bin/folkways hook
          FOLKWAYS_HOOK_BUDGET_MS: '10'
        run: go test -count=1 ./contract
      - name: Build script tests
        run: pnpm --filter @folkways/hooks exec vitest run

  # The CLI contract suite (packages/folkways/clicontract) against the TypeScript CLI from source.
  # The Go port runs the same fixtures with FOLKWAYS_CLI_CMD (ADR 0011).
  cli-contract:
    name: cli contract
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.hooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Contract suite against the TS CLI
        working-directory: packages/folkways
        run: go test -count=1 ./clicontract/

  evals:
    name: evals
    needs: changes
    if: needs.changes.outputs.evals == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folkways/evals run check
      - name: Unit tests (no model calls)
        run: pnpm --filter @folkways/evals test

  claude-plugin:
    name: claude plugin
    needs: changes
    if: needs.changes.outputs.claude-plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @folkways/claude-plugin run check
      - run: pnpm --filter @folkways/claude-plugin test
      - run: pnpm --filter "@folkways/claude-plugin..." run build

  # Packs the CLI and the four platform packages, installs them with npm and pnpm, and runs the hook
  # contract suite against the installed binary (ADR 0002). the darwin packages ship but have no runner here:
  # macOS runners bill at 10x Linux. linux-x64 and linux-arm64 cover the amd64 and arm64 builds.
  smoke:
    name: smoke (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.cli == 'true' || needs.changes.outputs.hooks == 'true' || needs.changes.outputs.claude-plugin == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm run smoke

  # Every change: scan the commits for leaked credentials.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The CLI image, pinned by digest (no third-party action). Scans the PR's or push's commits.
      - name: TruffleHog 3.97.9
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.after }}
        run: |
          since=()
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ]; then since=(--since-commit "$BASE"); fi
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/trufflesecurity/trufflehog@sha256:52e67fef4d054ecff5c2ce4b4ae376626d1ef54aa0898b53cac19c25e92e14db \
            git file:///repo "${since[@]}" --branch "$HEAD" \
            --results=verified,unknown --fail --fail-on-scan-errors --no-update --github-actions

  ci:
    name: ci
    if: always()
    needs: [changes, content, cli-check, cli-test, cli-contract, hooks, evals, claude-plugin, smoke, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a needed job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
