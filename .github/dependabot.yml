# Version updates wait out a cooldown so a compromised release has time to be caught and pulled.
# Security updates ignore the cooldown. pnpm-workspace.yaml enforces the same 7-day minimum on installs.
version: 2
updates:
  - package-ecosystem: npm       # covers pnpm-lock.yaml
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    versioning-strategy: increase
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: build
      include: scope

  - package-ecosystem: gomod
    directory: /packages/hooks
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
